<!DOCTYPE html>
<html lang="ko" class="">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="이강현(Kanghyun Lee) - Frontend Developer Portfolio" />
    <title>이강현 | Frontend Developer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet" />
    <script>
      // Mirrors resolveInitialTheme() in src/utils/theme.ts. Runs before the
      // app mounts so dark-mode visitors never see a white flash.
      (function () {
        try {
          var stored = localStorage.getItem('theme')
          var dark = stored === 'dark' || (stored !== 'light' &&
            window.matchMedia('(prefers-color-scheme: dark)').matches)
          if (dark) document.documentElement.classList.add('dark')
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
